<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
:root{
  --green:#0f5132;
  --green-light:#e6f2ec;
  --bg:#0b3d2e;
  --card:#ffffff;
}
body{
  font-family: system-ui,-apple-system,BlinkMacSystemFont;
  margin:0;
  padding:16px;
  background:var(--bg);
}
h1{color:white;margin-bottom:12px;}
.section{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
}
.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.edit-icon{
  font-size:20px;
  cursor:pointer;
  opacity:.5;
}
.edit-icon.active{opacity:1;color:var(--green);}
select{width:100%;padding:10px;font-size:16px;border-radius:10px;}
input[type=range]{width:100%;}
.player{
  padding:14px;
  border-radius:12px;
  margin-bottom:6px;
  font-size:17px;
  cursor:pointer;
  background:#f5f5f5;
}
.player.present{background:var(--green-light);}
.player.absent{background:#eee;color:#777;}
.edit-panel{
  padding:10px;
  background:#fafafa;
  border-left:4px solid var(--green);
  border-radius:10px;
  margin-bottom:10px;
}
.team-card{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  border-left:6px solid var(--green);
}
button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--green);
  color:white;
  font-size:16px;
}
button.secondary{background:#ddd;color:black;}
#pwModal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}
#pwModal .box{
  background:white;
  padding:20px;
  border-radius:16px;
  width:90%;max-width:320px;
}
#pwModal input{width:100%;font-size:26px;text-align:center;}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
  <h2>👥 Mannschaft</h2>
  <select id="teamSelect"></select>
</div>

<div class="section">
  <div class="card-header">
    <h2>⚙️ Einstellungen</h2>
    <span id="editIcon" class="edit-icon">📊</span>
  </div>

  <label>Anzahl Mannschaften</label>
  <select id="teamCount">
    <option>2</option><option>3</option><option>4</option>
    <option>5</option><option>6</option><option>7</option><option>8</option>
  </select>

  <label>🎲 Modus: <strong><span id="varLabel"></span></strong></label>
  <input type="range" min="0" max="3" step="1" id="variance">
</div>

<div class="section">
  <h2>👥 Spieler</h2>
  <div id="spieler"></div>
</div>

<div class="section">
  <button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
  <h2>🏁 Mannschaften</h2>
  <div id="output"></div>
</div>

<!-- Passwort -->
<div id="pwModal">
  <div class="box">
    <h3>🔒 Passwort</h3>
    <input type="number" id="pwInput" inputmode="numeric">
    <button onclick="confirmPassword()">OK</button>
    <button class="secondary" onclick="closePw()">Abbrechen</button>
  </div>
</div>

<script>
// ===== DOM =====
const spielerDiv = document.getElementById("spieler");
const varLabel   = document.getElementById("varLabel");
const editIcon   = document.getElementById("editIcon");
const teamSelect = document.getElementById("teamSelect");

// ===== KONFIG =====
const PASS = "1406";
const VARIANCE_MODES = [
  {value:0,label:"Fair‑Modus"},
  {value:30,label:"Trainings‑Mix"},
  {value:60,label:"Herausforderungs‑Modus"},
  {value:100,label:"Spaß‑Modus"}
];

const TEAMS = {
  "Alte Herren":[
    ["Alex",1,3,3,3,3,3,3],
    ["Birk",1,4,4,3,4,3,3]
  ]
};

// ===== STATE =====
let spieler = structuredClone(TEAMS["Alte Herren"]);
let editMode = false;
let varianceIndex = 0;

// ===== PASSWORT =====
let pwCallback=null;
function requestPassword(cb){
  pwCallback=cb;
  pwInput.value="";
  pwModal.style.display="flex";
  pwInput.focus();
}
function confirmPassword(){
  if(pwInput.value!==PASS){alert("Falsches Passwort");closePw();return;}
  closePw();pwCallback&&pwCallback();
}
function closePw(){pwModal.style.display="none";}

// ===== EDIT =====
editIcon.onclick=()=>requestPassword(()=>{
  editMode=!editMode;
  editIcon.classList.toggle("active",editMode);
  renderSpieler();
});

// ===== SPIELER =====
function togglePresent(i){
  spieler[i][1]=spieler[i][1]?0:1;
  renderSpieler();
}

function renderSpieler(){
  spielerDiv.innerHTML="";
  spieler.forEach((s,i)=>{
    const p=document.createElement("div");
    p.className="player "+(s[1]?"present":"absent");
    p.textContent=s[0];
    p.addEventListener("click",()=>togglePresent(i));
    spielerDiv.appendChild(p);

    if(editMode){
      const ep=document.createElement("div");
      ep.className="edit-panel";
      ep.textContent="Bewertungen hier …";
      spielerDiv.appendChild(ep);
    }
  });
}

// ===== MODUS =====
variance.oninput=()=>{
  varianceIndex=+variance.value;
  varLabel.textContent=
    VARIANCE_MODES[varianceIndex].label+
    " ("+VARIANCE_MODES[varianceIndex].value+"%)";
};
variance.value=0;
varLabel.textContent="Fair‑Modus (0%)";

// ===== TEAMS =====
function berechneTeams(){
  output.innerHTML="<div class='team-card'>Teams berechnet ✅</div>";
}

// ===== INIT =====
renderSpieler();
</script>

</body>
</html>
