<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  margin: 0;
  padding: 16px;
  background: #f4f6f8;
}

h1, h2 { margin-top: 0.5em; }

.section {
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 16px;
}

label {
  font-weight: 600;
  display: block;
  margin-top: 10px;
}

input[type=range] { width: 100%; }
input[type=number] { width: 80px; font-size: 16px; }

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  background: #007aff;
  color: white;
}

button.secondary {
  background: #e0e0e0;
  color: black;
}

/* ===============================
   👥 SPIELER SWIPE UI
=============================== */

.player-wrapper {
  overflow-x: auto;
  display: flex;
  scroll-snap-type: x mandatory;
  border-radius: 12px;
  margin-bottom: 12px;
}

.player-compact,
.player-edit {
  flex: 0 0 100%;
  scroll-snap-align: start;
  padding: 12px;
  background: #fff;
}

.player-compact {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.player-compact input {
  font-size: 16px;
  flex: 1;
}

.player-edit {
  background: #f9f9f9;
}

.team-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
<h2>⚙️ Einstellungen</h2>

<label>Anzahl Mannschaften</label>
<input type="number" id="teamCount" min="2" max="10">

<label>🎲 Modus: <strong><span id="varLabel"></span></strong></label>
<input type="range" min="0" max="3" step="1" id="variance">
</div>

<div class="section">
<h2>👥 Spieler</h2>
<div id="spieler"></div>
<button class="secondary" onclick="addSpieler()">➕ Spieler hinzufügen</button>
</div>

<div class="section">
<button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
<h2>🏁 Mannschaften</h2>
<div id="output"></div>
</div>

<script>
// ===============================
// DATEN
// ===============================
const VARIANCE_MODES = [
  { value: 0, label: "Fair‑Modus" },
  { value: 30, label: "Trainings‑Mix" },
  { value: 60, label: "Herausforderungs‑Modus" },
  { value: 100, label: "Spaß‑Modus" }
];

let teams = 4;
let varianceIndex = 0;

let spieler = [
["Alex Gruen",1,3,3,3,3,3,3],
["Frank",1,5,5,5,4,4,5],
["Jonas",1,4,5,4,4,4,4],
["Moser",1,4,3,4,3,4,3]
];

// ===============================
// UI INIT
// ===============================
const teamInput = document.getElementById("teamCount");
const varianceInput = document.getElementById("variance");
const varLabel = document.getElementById("varLabel");

teamInput.value = teams;
varianceInput.value = varianceIndex;
varLabel.innerText = VARIANCE_MODES[varianceIndex].label;

varianceInput.oninput = () => {
  varianceIndex = +varianceInput.value;
  varLabel.innerText = VARIANCE_MODES[varianceIndex].label;
};

// ===============================
// SPIELER UI
// ===============================
function renderSpieler() {
  const div = document.getElementById("spieler");
  div.innerHTML = "";

  spieler.forEach((s,i)=>{
    div.innerHTML += `
<div class="player-wrapper">

  <!-- KOMPAKT -->
  <div class="player-compact">
    <input value="${s[0]}" onchange="spieler[${i}][0]=this.value">
    <select onchange="spieler[${i}][1]=+this.value">
      <option value="1" ${s[1]?"selected":""}>✅</option>
      <option value="0" ${!s[1]?"selected":""}>❌</option>
    </select>
  </div>

  <!-- EDIT (Swipe links) -->
  <div class="player-edit">
    ${["Ball","Lauf","IQ","Def","Off","Chancen"].map((n,j)=>`
      <label>${n}: ${s[j+2]}</label>
      <input type="range" min="1" max="5" value="${s[j+2]}"
        oninput="spieler[${i}][${j+2}]=+this.value;renderSpieler()">
    `).join("")}
    <button class="secondary" onclick="removeSpieler(${i})">❌ Spieler löschen</button>
  </div>

</div>`;
  });
}

function addSpieler() {
  spieler.push(["Neu",1,3,3,3,3,3,3]);
  renderSpieler();
}

function removeSpieler(i) {
  spieler.splice(i,1);
  renderSpieler();
}

// ===============================
// TEAMLOGIK
// ===============================
function berechneTeams() {
  const aktive = spieler.filter(s=>s[1]);
  const variance = VARIANCE_MODES[varianceIndex].value;

  const sortiert = aktive
    .map(s=>{
      const base = s.slice(2).reduce((a,b)=>a+b,0);
      const noise = (Math.random()-0.5)*variance/100*base;
      return {name:s[0], score:base+noise};
    })
    .sort((a,b)=>b.score-a.score);

  let arr = Array.from({length:teams},()=>[]);
  let idx=0,dir=1;

  sortiert.forEach(sp=>{
    arr[idx].push(sp.name);
    idx+=dir;
    if(idx===teams){idx--;dir=-1;}
    if(idx<0){idx=0;dir=1;}
  });

  const out=document.getElementById("output");
  out.innerHTML="";
  arr.forEach((t,i)=>{
    out.innerHTML+=`<div class="team-card"><b>Mannschaft ${i+1}</b><br>${t.join(", ")}</div>`;
  });
}

// ===============================
renderSpieler();
</script>

</body>
</html>
