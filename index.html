<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  margin: 0;
  padding: 16px;
  background: #f4f6f8;
}
.section {
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 16px;
}
h1, h2 { margin-top: 0.5em; }

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  background: #007aff;
  color: white;
}
button.secondary {
  background: #e0e0e0;
  color: black;
}

select {
  width: 100%;
  font-size: 16px;
  padding: 8px;
}

input[type=range] { width: 100%; }

.player {
  padding: 12px;
  border-bottom: 1px solid #eee;
  font-size: 18px;
  cursor: pointer;
}
.player.present { background: #e8f8f0; }
.player.absent { background: #f0f0f0; color: #999; }

.edit-panel {
  padding-left: 10px;
  margin-bottom: 10px;
}

label {
  font-weight: 600;
  display: block;
  margin-top: 6px;
}

.team-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}

.goalkeeper-box {
  background:#eef5ff;
  padding:8px;
  border-radius:8px;
  margin-bottom:8px;
}

/* Passwort Modal */
#pwModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
#pwModal .box {
  background: white;
  border-radius: 14px;
  padding: 20px;
  width: 90%;
  max-width: 320px;
}
#pwModal input {
  font-size: 26px;
  text-align: center;
  width: 100%;
}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
<h2>👥 Mannschaft</h2>
<select id="teamSelect"></select>
<p style="font-size:14px;color:#666;">Antippen → Passwort → wechseln 🔒</p>
</div>

<div class="section">
<h2>⚙️ Einstellungen</h2>

<label>Anzahl Mannschaften</label>
<select id="teamCount">
  <option>2</option><option>3</option><option>4</option>
  <option>5</option><option>6</option><option>7</option><option>8</option>
</select>

<label>🎲 Modus: <strong><span id="varLabel"></span></strong></label>
<input type="range" min="0" max="3" step="1" id="variance">

<button class="secondary" onclick="requestPassword(toggleEdit)">
🔒 Edit‑Modus (Bewertungen)
</button>
</div>

<div class="section" id="goalkeeperSection" style="display:none;">
<h2>🧤 Torhüter (E‑Jugend)</h2>

<label>Torhüter 1</label>
<select id="gk1"></select>

<label>Torhüter 2</label>
<select id="gk2"></select>
</div>

<div class="section">
<h2>👥 Spieler</h2>
<div id="spieler"></div>
</div>

<div class="section">
<button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
<h2>🏁 Mannschaften</h2>
<div id="output"></div>
</div>

<!-- Passwort Modal -->
<div id="pwModal">
  <div class="box">
    <h3>🔒 Passwort</h3>
    <input type="number" id="pwInput" inputmode="numeric" maxlength="4">
    <button onclick="confirmPassword()">OK</button>
    <button class="secondary" onclick="closePw()">Abbrechen</button>
  </div>
</div>

<script>
// ===============================
// KONFIG
// ===============================
const EDIT_PASSWORT = "1406";
let pwCallback = null;

const VARIANCE_MODES = [
  { value: 0, label: "Fair‑Modus" },
  { value: 30, label: "Trainings‑Mix" },
  { value: 60, label: "Herausforderungs‑Modus" },
  { value: 100, label: "Spaß‑Modus" }
];

// ===============================
// MANNSCHAFTEN
// ===============================
const TEAMS = {
  "Alte Herren": [
    ["Alex Gruen",1,3,3,3,3,3,3],
    ["Alex Koerkel",1,3,2,3,4,3,3],
    ["Andi Doerr",1,3,2,2,3,2,2],
    ["Birk",1,4,4,3,4,3,3],
    ["Christian",1,2,5,1,2,1,1]
  ],
  "E‑Jugend": [
    ["Samuel",1,3,4,3,4,3,3],
    ["Jonah",1,5,1,4,4,3,3],
    ["Moritz",1,3,4,2,4,3,2],
    ["Paul",1,3,3,3,3,3,3],
    ["Toni",1,4,3,3,3,4,4]
  ]
};

// ===============================
// PASSWORT MODAL
// ===============================
function requestPassword(cb) {
  pwCallback = cb;
  document.getElementById("pwInput").value = "";
  document.getElementById("pwModal").style.display = "flex";
  setTimeout(()=>document.getElementById("pwInput").focus(),50);
}

function confirmPassword() {
  const val = document.getElementById("pwInput").value;
  if (val !== EDIT_PASSWORT) {
    alert("Falsches Passwort");
    return;
  }
  closePw();
  pwCallback && pwCallback();
}

function closePw() {
  document.getElementById("pwModal").style.display = "none";
}

// ===============================
// STATE
// ===============================
let activeTeam = localStorage.getItem("activeTeam") || Object.keys(TEAMS)[0];
let STORAGE_KEY = "teamgenerator_" + activeTeam;

let spieler = [];
let teams = 4;
let varianceIndex = 0;
let editMode = false;
let goalkeepers = {1:null,2:null};

// ===============================
// LOAD TEAM
// ===============================
function loadTeam(teamName) {
  activeTeam = teamName;
  STORAGE_KEY = "teamgenerator_" + activeTeam;
  localStorage.setItem("activeTeam", activeTeam);

  let data = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (!data) {
    data = {
      spieler: structuredClone(TEAMS[activeTeam]),
      teams: 4,
      varianceIndex: 0,
      goalkeepers: {1:null,2:null}
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  spieler = data.spieler;
  teams = data.teams;
  varianceIndex = data.varianceIndex;
  goalkeepers = data.goalkeepers || {1:null,2:null};

  document.getElementById("goalkeeperSection").style.display =
    activeTeam === "E‑Jugend" ? "block" : "none";

  initTeamSelect();
  updateSettingsUI();
  renderGoalkeeperUI();
  renderSpieler();
  document.getElementById("output").innerHTML = "";
}

// ===============================
// SAVE
// ===============================
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    spieler, teams, varianceIndex, goalkeepers
  }));
}

// ===============================
// TEAM DROPDOWN (MOBILE‑SICHER)
// ===============================
const teamSelect = document.getElementById("teamSelect");
let teamUnlocked = false;

function initTeamSelect(){
  teamSelect.innerHTML="";
  Object.keys(TEAMS).forEach(t=>{
    const o=document.createElement("option");
    o.value=t;o.textContent=t;
    teamSelect.appendChild(o);
  });
  teamSelect.value=activeTeam;
}

teamSelect.addEventListener("change",()=>{
  if(!teamUnlocked){
    teamSelect.value = activeTeam;
    requestPassword(()=>{
      teamUnlocked = true;
      alert("Mannschaft freigegeben – bitte erneut auswählen");
    });
    return;
  }
  teamUnlocked = false;
  loadTeam(teamSelect.value);
});

// ===============================
// SETTINGS
// ===============================
const teamCountSelect=document.getElementById("teamCount");
const varianceInput=document.getElementById("variance");
const varLabel=document.getElementById("varLabel");

function updateSettingsUI(){
  teamCountSelect.value=teams;
  varianceInput.value=varianceIndex;
  varLabel.innerText =
    VARIANCE_MODES[varianceIndex].label +
    " (" + VARIANCE_MODES[varianceIndex].value + "%)";
}

teamCountSelect.onchange=()=>{
  teams=+teamCountSelect.value;
  save();
};

varianceInput.oninput=()=>{
  varianceIndex=+varianceInput.value;
  varLabel.innerText =
    VARIANCE_MODES[varianceIndex].label +
    " (" + VARIANCE_MODES[varianceIndex].value + "%)";
  save();
};

// ===============================
// EDIT MODE
// ===============================
function toggleEdit(){
  editMode=!editMode;
  renderSpieler();
}

// ===============================
// TORHÜTER UI
// ===============================
function renderGoalkeeperUI(){
  if(activeTeam!=="E‑Jugend") return;

  const gk1=document.getElementById("gk1");
  const gk2=document.getElementById("gk2");

  const anwesende=spieler.filter(s=>s[1]===1).map(s=>s[0]);

  function fill(sel,other){
    sel.innerHTML="<option value=''>Kein Torhüter</option>";
    anwesende.forEach(n=>{
      if(n===other) return;
      const o=document.createElement("option");
      o.value=n;o.textContent=n;
      sel.appendChild(o);
    });
  }

  fill(gk1,goalkeepers[2]);
  fill(gk2,goalkeepers[1]);

  gk1.value=goalkeepers[1]||"";
  gk2.value=goalkeepers[2]||"";

  gk1.onchange=()=>{goalkeepers[1]=gk1.value||null;save();renderGoalkeeperUI();};
  gk2.onchange=()=>{goalkeepers[2]=gk2.value||null;save();renderGoalkeeperUI();};
}

// ===============================
// SPIELER UI
// ===============================
function togglePresent(i){
  spieler[i][1]=spieler[i][1]?0:1;
  save();
  renderSpieler();
  renderGoalkeeperUI();
}

function renderSpieler(){
  const div=document.getElementById("spieler");
  div.innerHTML="";
  spieler.forEach((s,i)=>{
    div.innerHTML+=`
<div class="player ${s[1]?"present":"absent"}"
onclick="togglePresent(${i})">${s[0]}</div>
${editMode?`
<div class="edit-panel">
  ${["Ball","Lauf","IQ","Def","Off","Chancen"].map((n,j)=>`
    <label>${n}: ${s[j+2]}</label>
    <input type="range" min="1" max="5" value="${s[j+2]}"
    oninput="spieler[${i}][${j+2}]=+this.value;save()">
  `).join("")}
</div>`:""}
`;
  });
}

// ===============================
// TEAMLOGIK
// ===============================
function spielerStaerke(s){return s.slice(2).reduce((a,b)=>a+b,0);}

function berechneTeams(){
  const out=document.getElementById("output");
  out.innerHTML="";

  const gks=Object.values(goalkeepers).filter(Boolean);
  const feldspieler=spieler.filter(s=>s[1] && !gks.includes(s[0]));

  const sortiert=feldspieler.map(s=>{
    const base=spielerStaerke(s);
    const noise=(Math.random()-0.5)*VARIANCE_MODES[varianceIndex].value/100*base;
    return {name:s[0],base,score:base+noise};
  }).sort((a,b)=>b.score-a.score);

  let teamArr=Array.from({length:teams},()=>[]);
  let idx=0,dir=1;
  sortiert.forEach(sp=>{
    teamArr[idx].push(sp);
    idx+=dir;
    if(idx===teams){idx--;dir=-1;}
    if(idx<0){idx=0;dir=1;}
  });

  if(teams>gks.length && gks.length){
    out.innerHTML+=`
<div class="goalkeeper-box">
<b>Torhüter:</b><br>
${gks.map((g,i)=>`Torhüter ${i+1}: ${g}`).join("<br>")}
</div>`;
  }

  teamArr.forEach((t,i)=>{
    const sum=t.reduce((s,p)=>s+p.base,0);
    const avg=t.length?(sum/t.length).toFixed(1):"–";
    const gk=teams<=gks.length?`<br><b>Torhüter:</b> ${gks[i]||"–"}`:"";
    out.innerHTML+=`
<div class="team-card">
<b>Mannschaft ${i+1}</b> |
Spieler: ${t.length} |
Ø Stärke: ${avg}${gk}<br>
${t.map(p=>p.name).join(", ")}
</div>`;
  });
}

// ===============================
// INIT
// ===============================
loadTeam(activeTeam);
</script>

</body>
</html>
