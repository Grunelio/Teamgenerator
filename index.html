<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator – Fair‑Play‑Spieltag</title>

<style>
:root{
  --pitch:#0f5132;
  --pitch-light:#e8f8f0;
  --line:#ffffff;
  --fair:#ffd43b;
  --card:#ffffff;
  --gray:#f0f0f0;
}

/* ===== BACKGROUND: SPIELFELD ===== */
body{
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  margin:0;
  padding:16px;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.05) 0,
      rgba(255,255,255,0.05) 2px,
      transparent 2px,
      transparent 60px
    ),
    linear-gradient(
      rgba(255,255,255,0.03),
      rgba(255,255,255,0.03)
    ),
    var(--pitch);
}

h1{
  color:white;
  margin-bottom:10px;
}

/* ===== KARTEN ===== */
.section{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

h2{
  margin:0 0 8px 0;
  font-size:18px;
  display:flex;
  align-items:center;
  gap:6px;
}

/* ===== FORM ===== */
label{
  font-weight:600;
  margin-top:6px;
  display:block;
}

select,input[type=range]{
  width:100%;
  padding:8px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}

/* ===== SPIELER ===== */
.player{
  padding:12px;
  border-radius:12px;
  margin-bottom:6px;
  font-size:17px;
  cursor:pointer;
  background:var(--gray);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.player.present{
  background:var(--pitch-light);
}

.player.present::after{
  content:"🟢";
}

.player.absent{
  background:#eee;
  color:#777;
}

.player.absent::after{
  content:"⚪";
}

/* ===== EDIT PANEL ===== */
.edit-panel{
  padding:10px;
  background:#fafafa;
  border-left:4px solid var(--fair);
  border-radius:10px;
  margin-bottom:10px;
}

/* ===== TEAMS ===== */
.team-card{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  border-left:6px solid var(--pitch);
}

.goalkeeper-box{
  background:#eef5ff;
  border-left:6px solid #1c7ed6;
  padding:10px;
  border-radius:12px;
  margin-bottom:12px;
}

/* ===== BUTTONS ===== */
button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--pitch);
  color:white;
  font-size:16px;
}

button.secondary{
  background:#e0e0e0;
  color:black;
}

/* ===== PASSWORT ===== */
#pwModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

#pwModal .box{
  background:white;
  border-radius:18px;
  padding:20px;
  width:90%;
  max-width:320px;
}

#pwModal input{
  font-size:26px;
  width:100%;
  text-align:center;
}
</style>
</head>
