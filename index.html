<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
:root{
  --green:#0f5132;
  --green-light:#e6f2ec;
  --accent:#ffd43b;
  --card:#ffffff;
  --bg:#0b3d2e;
}

body{
  font-family: system-ui,-apple-system,BlinkMacSystemFont;
  margin:0;
  padding:16px;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.03) 0,
      rgba(255,255,255,0.03) 2px,
      transparent 2px,
      transparent 60px
    ),
    var(--bg);
  color:#111;
}

h1{
  color:white;
  margin-bottom:8px;
}

h2{
  margin:0 0 8px 0;
  font-size:18px;
}

.section{
  background:var(--card);
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.edit-icon{
  font-size:20px;
  cursor:pointer;
  opacity:0.5;
}
.edit-icon.active{
  color:var(--green);
  opacity:1;
}

select{
  width:100%;
  padding:10px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}

input[type=range]{ width:100%; }

.player{
  padding:12px;
  border-radius:10px;
  margin-bottom:6px;
  cursor:pointer;
  font-size:17px;
  background:#f7f7f7;
}
.player.present{
  background:var(--green-light);
}
.player.absent{
  background:#eee;
  color:#777;
}

.edit-panel{
  padding:10px;
  background:#fafafa;
  border-left:4px solid var(--green);
  border-radius:10px;
  margin-bottom:10px;
}

label{
  font-weight:600;
  font-size:14px;
}

.team-card{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  border-left:6px solid var(--green);
}

.goalkeeper-box{
  background:#eef5ff;
  border-radius:12px;
  padding:10px;
  margin-bottom:12px;
  border-left:6px solid #1c7ed6;
}

/* Passwort Modal */
#pwModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
#pwModal .box{
  background:white;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:320px;
}
#pwModal input{
  width:100%;
  font-size:26px;
  text-align:center;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--green);
  color:white;
  font-size:16px;
}
button.secondary{
  background:#ddd;
  color:#000;
}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
  <h2>👥 Mannschaft</h2>
  <select id="teamSelect"></select>
  <div style="font-size:13px;color:#666;margin-top:4px;">
    Antippen → Passwort → Wechsel
  </div>
</div>

<div class="section">
  <div class="card-header">
    <h2>⚙️ Einstellungen</h2>
    <span id="editIcon" class="edit-icon" title="Bewertungen bearbeiten">📊</span>
  </div>

  <label>Anzahl Mannschaften</label>
  <select id="teamCount">
    <option>2</option><option>3</option><option>4</option>
    <option>5</option><option>6</option><option>7</option><option>8</option>
  </select>

  <label>🎲 Modus: <strong><span id="varLabel"></span></strong></label>
  <input type="range" min="0" max="3" step="1" id="variance">
</div>

<div class="section" id="goalkeeperSection" style="display:none;">
  <h2>🧤 Torhüter (E‑Jugend)</h2>
  <label>Torhüter 1</label>
  <select id="gk1"></select>
  <label>Torhüter 2</label>
  <select id="gk2"></select>
</div>

<div class="section">
  <h2>👥 Spieler</h2>
  <div id="spieler"></div>
</div>

<div class="section">
  <button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
  <h2>🏁 Mannschaften</h2>
  <div id="output"></div>
</div>

<!-- Passwort -->
<div id="pwModal">
  <div class="box">
    <h3>🔒 Passwort</h3>
    <input type="number" id="pwInput" inputmode="numeric">
    <button onclick="confirmPassword()">OK</button>
    <button class="secondary" onclick="closePw()">Abbrechen</button>
  </div>
</div>

<script>

</script>

</body>
</html>
