<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  padding:16px;
}
.section {
  background:white;
  border-radius:10px;
  padding:12px;
  margin-bottom:14px;
}
.player {
  padding:10px;
  margin-bottom:6px;
  border-radius:6px;
  cursor:pointer;
  background:#eee;
}
.player.present { background:#cdeedc; }
.player.absent { background:#eee; color:#777; }
.team-card {
  background:#fff;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border-left:5px solid #0f5132;
}
.goalkeeper-box {
  background:#eef5ff;
  padding:8px;
  border-radius:8px;
  margin-bottom:10px;
}
label { font-weight:bold; display:block; margin-top:8px; }
select, input[type=range] { width:100%; margin-top:4px; }
button { padding:10px; width:100%; margin-top:10px; }
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
<label>Mannschaft</label>
<select id="teamSelect"></select>
</div>

<div class="section">
<label>Anzahl Mannschaften</label>
<select id="teamCount">
  <option>2</option><option>3</option><option>4</option>
  <option>5</option><option>6</option><option>7</option><option>8</option>
</select>

<label>Modus: <span id="varLabel"></span></label>
<input type="range" min="0" max="3" step="1" id="variance">
</div>

<div class="section" id="goalkeeperSection" style="display:none;">
<h3>🧤 Torhüter (E‑Jugend)</h3>

<label>Torhüter 1</label>
<select id="gk1"></select>

<label>Torhüter 2</label>
<select id="gk2"></select>
</div>

<div class="section">
<h3>Spieler (Tippen = an/abwesend)</h3>
<div id="spieler"></div>
</div>

<div class="section">
<button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
<h3>Mannschaften</h3>
<div id="output"></div>
</div>

<script>
// ================= KONFIG =================
const VARIANCE_MODES = [
  { value:0, label:"Fair‑Modus" },
  { value:30, label:"Trainings‑Mix" },
  { value:60, label:"Herausforderungs‑Modus" },
  { value:100, label:"Spaß‑Modus" }
];

// ================= SPIELER =================
const TEAMS = {
  "Alte Herren":[
    ["Alex Gruen",1,3,3,3,3,3,3],
    ["Birk",1,4,4,3,4,3,3],
    ["Frank",1,5,5,5,4,4,5]
  ],
  "E‑Jugend":[
    ["Samuel",1,3,4,3,4,3,3],
    ["Jonah",1,5,1,4,4,3,3],
    ["Moritz",1,3,4,2,4,3,2],
    ["Paul",1,3,3,3,3,3,3],
    ["Toni",1,4,3,3,3,4,4]
  ]
};

// ================= STATE =================
let activeTeam = "Alte Herren";
let spieler = [];
let teams = 2;
let varianceIndex = 0;
let goalkeepers = {1:null,2:null};

// ================= INIT =================
const teamSelect = document.getElementById("teamSelect");
Object.keys(TEAMS).forEach(t=>{
  const o=document.createElement("option");
  o.value=t; o.textContent=t;
  teamSelect.appendChild(o);
});
teamSelect.onchange=()=>loadTeam(teamSelect.value);

const variance = document.getElementById("variance");
const varLabel = document.getElementById("varLabel");
variance.oninput=()=>{
  varianceIndex = +variance.value;
  varLabel.textContent =
    VARIANCE_MODES[varianceIndex].label +
    " ("+VARIANCE_MODES[varianceIndex].value+"%)";
};
variance.value=0;
varLabel.textContent="Fair‑Modus (0%)";

document.getElementById("teamCount").onchange=e=>{
  teams = +e.target.value;
};

// ================= LOAD TEAM =================
function loadTeam(name){
  activeTeam = name;
  spieler = structuredClone(TEAMS[name]);
  goalkeepers = {1:null,2:null};
  document.getElementById("goalkeeperSection").style.display =
    name==="E‑Jugend" ? "block":"none";
  renderSpieler();
  renderGoalkeeperUI();
  document.getElementById("output").innerHTML="";
}

// ================= SPIELER UI =================
function renderSpieler(){
  const div=document.getElementById("spieler");
  div.innerHTML="";
  spieler.forEach((s,i)=>{
    const d=document.createElement("div");
    d.className="player "+(s[1]?"present":"absent");
    d.textContent=s[0];
    d.onclick=()=>{
      s[1]=s[1]?0:1;
      // wenn abwesend → aus GK entfernen
      if(!s[1]){
        if(goalkeepers[1]===s[0]) goalkeepers[1]=null;
        if(goalkeepers[2]===s[0]) goalkeepers[2]=null;
      }
      renderSpieler();
      renderGoalkeeperUI();
    };
    div.appendChild(d);
  });
}

// ================= TORHÜTER (KORREKT) =================
function renderGoalkeeperUI(){
  if(activeTeam!=="E‑Jugend") return;

  const gk1=document.getElementById("gk1");
  const gk2=document.getElementById("gk2");

  const anwesend = spieler.filter(s=>s[1]).map(s=>s[0]);

  function fill(select, other){
    select.innerHTML="<option value=''>Kein Torhüter</option>";
    anwesend.forEach(n=>{
      if(n===other) return;
      const o=document.createElement("option");
      o.value=n; o.textContent=n;
      select.appendChild(o);
    });
  }

  fill(gk1, goalkeepers[2]);
  fill(gk2, goalkeepers[1]);

  gk1.value = goalkeepers[1] || "";
  gk2.value = goalkeepers[2] || "";

  gk1.onchange=()=>{
    goalkeepers[1]=gk1.value||null;
    renderGoalkeeperUI();
  };
  gk2.onchange=()=>{
    goalkeepers[2]=gk2.value||null;
    renderGoalkeeperUI();
  };
}

// ================= TEAMLOGIK =================
function spielerStaerke(s){
  return s.slice(2).reduce((a,b)=>a+b,0);
}

function berechneTeams(){
  const out=document.getElementById("output");
  out.innerHTML="";

  const gks=Object.values(goalkeepers).filter(Boolean);
  const feldspieler=spieler.filter(s=>s[1] && !gks.includes(s[0]));

  const sortiert=feldspieler.map(s=>{
    const base=spielerStaerke(s);
    const noise=(Math.random()-0.5)*VARIANCE_MODES[varianceIndex].value/100*base;
    return {name:s[0],base,score:base+noise};
  }).sort((a,b)=>b.score-a.score);

  let arr=Array.from({length:teams},()=>[]);
  let idx=0,dir=1;
  sortiert.forEach(sp=>{
    arr[idx].push(sp);
    idx+=dir;
    if(idx===teams){idx--;dir=-1;}
    if(idx<0){idx=0;dir=1;}
  });

  if(teams>gks.length && gks.length){
    out.innerHTML+=`
<div class="goalkeeper-box">
<b>Torhüter:</b><br>
${gks.map((g,i)=>`Torhüter ${i+1}: ${g}`).join("<br>")}
</div>`;
  }

  arr.forEach((t,i)=>{
    const avg=t.length?(t.reduce((s,p)=>s+p.base,0)/t.length).toFixed(1):"–";
    const gk=teams<=gks.length?`<br><b>Torhüter:</b> ${gks[i]||"–"}`:"";
    out.innerHTML+=`
<div class="team-card">
<b>Mannschaft ${i+1}</b> | Spieler: ${t.length} | Ø Stärke: ${avg}${gk}<br>
${t.map(p=>p.name).join(", ")}
</div>`;
  });
}

// ================= START =================
loadTeam(activeTeam);
</script>

</body>
</html>
