<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  margin: 0;
  padding: 16px;
  background: #f4f6f8;
}
.section {
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 16px;
}
h1, h2 { margin-top: 0.5em; }

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  background: #007aff;
  color: white;
}
button.secondary {
  background: #e0e0e0;
  color: black;
}

select, input[type=number] {
  width: 100%;
  font-size: 16px;
  padding: 8px;
}

input[type=range] { width: 100%; }

.player {
  padding: 12px;
  border-bottom: 1px solid #eee;
  font-size: 18px;
  cursor: pointer;
}
.player.present { background: #e8f8f0; }
.player.absent { background: #f0f0f0; color: #999; }

.edit-panel {
  padding-left: 10px;
  margin-bottom: 10px;
}

label {
  font-weight: 600;
  display: block;
  margin-top: 6px;
}

.team-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}

.goalkeeper-box {
  background:#eef5ff;
  padding:8px;
  border-radius:8px;
  margin-bottom:8px;
}

/* ✅ Passwort Modal */
#pwModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
#pwModal .box {
  background: white;
  border-radius: 14px;
  padding: 20px;
  width: 90%;
  max-width: 320px;
}
#pwModal input {
  font-size: 22px;
  text-align: center;
}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
<h2>👥 Mannschaft</h2>
<select id="teamSelect" disabled></select>
<p style="font-size:14px;color:#666;">Tippe auf die Mannschaft zum Wechseln 🔒</p>
</div>

<div class="section">
<h2>⚙️ Einstellungen</h2>

<label>Anzahl Mannschaften</label>
<select id="teamCount">
  <option>2</option><option>3</option><option>4</option>
  <option>5</option><option>6</option><option>7</option><option>8</option>
</select>

<label>🎲 Modus: <strong><span id="varLabel"></span></strong></label>
<input type="range" min="0" max="3" step="1" id="variance">

<button class="secondary" onclick="requestPassword(toggleEdit)">
🔒 Edit‑Modus (Bewertungen)
</button>
</div>

<div class="section" id="goalkeeperSection" style="display:none;">
<h2>🧤 Torhüter (E‑Jugend)</h2>

<label>Torhüter 1</label>
<select id="gk1"></select>

<label>Torhüter 2</label>
<select id="gk2"></select>
</div>

<div class="section">
<h2>👥 Spieler</h2>
<div id="spieler"></div>
</div>

<div class="section">
<button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
<h2>🏁 Mannschaften</h2>
<div id="output"></div>
</div>

<!-- ✅ Passwort Modal -->
<div id="pwModal">
  <div class="box">
    <h3>🔒 Passwort</h3>
    <input type="number" id="pwInput" inputmode="numeric" maxlength="4">
    <button onclick="confirmPassword()">OK</button>
    <button class="secondary" onclick="closePw()">Abbrechen</button>
  </div>
</div>

<script>
// ===============================
// KONFIG
// ===============================
const EDIT_PASSWORT = "1406";
let pwCallback = null;

// ===============================
// PASSWORT MODAL
// ===============================
function requestPassword(cb) {
  pwCallback = cb;
  document.getElementById("pwInput").value = "";
  document.getElementById("pwModal").style.display = "flex";
  document.getElementById("pwInput").focus();
}

function confirmPassword() {
  const val = document.getElementById("pwInput").value;
  if (val !== EDIT_PASSWORT) {
    alert("Falsches Passwort");
    return;
  }
  closePw();
  pwCallback && pwCallback();
}

function closePw() {
  document.getElementById("pwModal").style.display = "none";
}

// ===============================
// RESTLICHER CODE
// ===============================
// 👉 HIER BLEIBT ALLES WIE IN DER LETZTEN VERSION
// 👉 Torhüter-Logik, Teamlogik, Dropdown-Logik unverändert
// 👉 Aus Platzgründen hier nicht erneut gekürzt oder verändert
// 👉 Du kannst diesen Block DIREKT in deinen bestehenden Code einsetzen
</script>

</body>
</html>
