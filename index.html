<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
:root{
  --green:#0f5132;
  --green-light:#e6f2ec;
  --bg:#0b3d2e;
  --card:#ffffff;
  --accent:#ffd43b;
}

body{
  font-family: system-ui,-apple-system,BlinkMacSystemFont;
  margin:0;
  padding:16px;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.04) 0,
      rgba(255,255,255,0.04) 2px,
      transparent 2px,
      transparent 60px
    ),
    var(--bg);
}

h1{
  color:white;
  margin-bottom:10px;
}

.section{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h2{
  margin:0;
  font-size:18px;
}

.edit-icon{
  font-size:20px;
  cursor:pointer;
  opacity:.5;
}
.edit-icon.active{
  opacity:1;
  color:var(--green);
}

select{
  width:100%;
  padding:10px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}

input[type=range]{ width:100%; }

.player{
  padding:12px;
  border-radius:12px;
  margin-bottom:6px;
  font-size:17px;
  cursor:pointer;
  background:#f5f5f5;
}
.player.present{ background:var(--green-light); }
.player.absent{ background:#eee;color:#777; }

.edit-panel{
  padding:10px;
  background:#fafafa;
  border-left:4px solid var(--green);
  border-radius:10px;
  margin-bottom:10px;
}

label{
  font-weight:600;
  font-size:14px;
}

.team-card{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  border-left:6px solid var(--green);
}

.goalkeeper-box{
  background:#eef5ff;
  border-radius:12px;
  padding:10px;
  margin-bottom:12px;
  border-left:6px solid #1c7ed6;
}

/* Passwort Modal */
#pwModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
#pwModal .box{
  background:white;
  padding:20px;
  border-radius:18px;
  width:90%;
  max-width:320px;
}
#pwModal input{
  width:100%;
  font-size:26px;
  text-align:center;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--green);
  color:white;
  font-size:16px;
}
button.secondary{
  background:#ddd;
  color:black;
}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
  <h2>👥 Mannschaft</h2>
  <select id="teamSelect"></select>
  <div style="font-size:13px;color:#666;margin-top:4px;">
    Antippen → Passwort → Wechsel
  </div>
</div>

<div class="section">
  <div class="card-header">
    <h2>⚙️ Einstellungen</h2>
    <span id="editIcon" class="edit-icon" title="Bewertungen bearbeiten">📊</span>
  </div>

  <label>Anzahl Mannschaften</label>
  <select id="teamCount">
    <option>2</option><option>3</option><option>4</option>
    <option>5</option><option>6</option><option>7</option><option>8</option>
  </select>

  <label>🎲 Modus: <strong><span id="varLabel"></span></strong></label>
  <input type="range" min="0" max="3" step="1" id="variance">
</div>

<div class="section" id="goalkeeperSection" style="display:none;">
  <h2>🧤 Torhüter (E‑Jugend)</h2>
  <label>Torhüter 1</label>
  <select id="gk1"></select>
  <label>Torhüter 2</label>
  <select id="gk2"></select>
</div>

<div class="section">
  <h2>👥 Spieler</h2>
  <div id="spieler"></div>
</div>

<div class="section">
  <button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
  <h2>🏁 Mannschaften</h2>
  <div id="output"></div>
</div>

<!-- Passwort -->
<div id="pwModal">
  <div class="box">
    <h3>🔒 Passwort</h3>
    <input type="number" id="pwInput" inputmode="numeric">
    <button onclick="confirmPassword()">OK</button>
    <button class="secondary" onclick="closePw()">Abbrechen</button>
  </div>
</div>

<script>
// ================= KONFIG =================
const EDIT_PASSWORT="1406";
let pwCallback=null;

const VARIANCE_MODES=[
  {value:0,label:"Fair‑Modus"},
  {value:30,label:"Trainings‑Mix"},
  {value:60,label:"Herausforderungs‑Modus"},
  {value:100,label:"Spaß‑Modus"}
];

const TEAMS={
  "Alte Herren":[
    ["Alex Gruen",1,3,3,3,3,3,3],
    ["Alex Koerkel",1,3,2,3,4,3,3],
    ["Andi Doerr",1,3,2,2,3,2,2],
    ["Birk",1,4,4,3,4,3,3],
    ["Christian",1,2,5,1,2,1,1]
  ],
  "E‑Jugend":[
    ["Samuel",1,3,4,3,4,3,3],
    ["Jonah",1,5,1,4,4,3,3],
    ["Moritz",1,3,4,2,4,3,2],
    ["Paul",1,3,3,3,3,3,3],
    ["Toni",1,4,3,3,3,4,4]
  ]
};

// ================= PASSWORT =================
function requestPassword(cb){
  pwCallback=cb;
  pwInput.value="";
  pwModal.style.display="flex";
  setTimeout(()=>pwInput.focus(),50);
}
function confirmPassword(){
  if(pwInput.value!==EDIT_PASSWORT){
    alert("Falsches Passwort");
    closePw(); revertTeamSelect(); return;
  }
  closePw(); pwCallback&&pwCallback();
}
function closePw(){ pwModal.style.display="none"; }

// ================= STATE =================
let activeTeam=localStorage.getItem("activeTeam")||Object.keys(TEAMS)[0];
let pendingTeam=null;
let STORAGE_KEY="";
let spieler=[],teams=4,varianceIndex=0,editMode=false;
let goalkeepers={1:null,2:null};

// ================= TEAM SELECT =================
function initTeamSelect(){
  teamSelect.innerHTML="";
  Object.keys(TEAMS).forEach(t=>{
    const o=document.createElement("option");
    o.value=t;o.textContent=t;
    teamSelect.appendChild(o);
  });
  teamSelect.value=activeTeam;
}
function revertTeamSelect(){ teamSelect.value=activeTeam; }

teamSelect.onchange=()=>{
  const sel=teamSelect.value;
  if(sel===activeTeam) return;
  pendingTeam=sel;
  requestPassword(()=>{ loadTeam(pendingTeam); pendingTeam=null; });
};

// ================= LOAD / SAVE =================
function loadTeam(name){
  activeTeam=name;
  STORAGE_KEY="teamgenerator_"+activeTeam;
  localStorage.setItem("activeTeam",activeTeam);

  let data=JSON.parse(localStorage.getItem(STORAGE_KEY));
  if(!data){
    data={spieler:structuredClone(TEAMS[activeTeam]),teams:4,varianceIndex:0,goalkeepers:{1:null,2:null}};
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  }
  spieler=data.spieler;teams=data.teams;varianceIndex=data.varianceIndex;
  goalkeepers=data.goalkeepers||{1:null,2:null};

  goalkeeperSection.style.display=activeTeam==="E‑Jugend"?"block":"none";
  initTeamSelect();updateSettings();renderGoalkeeperUI();renderSpieler();
  output.innerHTML="";
}
function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify({spieler,teams,varianceIndex,goalkeepers}));
}

// ================= SETTINGS =================
function updateSettings(){
  teamCount.value=teams;
  variance.value=varianceIndex;
  varLabel.innerText=VARIANCE_MODES[varianceIndex].label+" ("+VARIANCE_MODES[varianceIndex].value+"%)";
}
teamCount.onchange=()=>{teams=+teamCount.value;save();};
variance.oninput=()=>{varianceIndex=+variance.value;updateSettings();save();};

// ================= EDIT MODE =================
editIcon.onclick=()=>requestPassword(()=>{
  editMode=!editMode;
  editIcon.classList.toggle("active",editMode);
  renderSpieler();
});

// ================= TORHÜTER =================
function renderGoalkeeperUI(){
  if(activeTeam!=="E‑Jugend") return;
  const anwesend=spieler.filter(s=>s[1]).map(s=>s[0]);
  function fill(sel,other){
    sel.innerHTML="<option value=''>Kein Torhüter</option>";
    anwesend.forEach(n=>{
      if(n===other) return;
      const o=document.createElement("option");
      o.value=n;o.textContent=n;sel.appendChild(o);
    });
  }
  fill(gk1,goalkeepers[2]); fill(gk2,goalkeepers[1]);
  gk1.value=goalkeepers[1]||""; gk2.value=goalkeepers[2]||"";
  gk1.onchange=()=>{goalkeepers[1]=gk1.value||null;save();renderGoalkeeperUI();};
  gk2.onchange=()=>{goalkeepers[2]=gk2.value||null;save();renderGoalkeeperUI();};
}

// ================= SPIELER =================
function togglePresent(i){
  spieler[i][1]=spieler[i][1]?0:1;
  save();renderSpieler();renderGoalkeeperUI();
}
function renderSpieler(){
  spielerDiv.innerHTML="";
  spieler.forEach((s,i)=>{
    spielerDiv.innerHTML+=`
<div class="player ${s[1]?"present":"absent"}" onclick="togglePresent(${i})">${s[0]}</div>
${editMode?`
<div class="edit-panel">
${["Ball","Lauf","IQ","Def","Off","Chancen"].map((n,j)=>`
<label>${n}: ${s[j+2]}</label>
<input type="range" min="1" max="5" value="${s[j+2]}"
oninput="spieler[${i}][${j+2}]=+this.value;save()">`).join("")}
</div>`:""}`;
  });
}

// ================= TEAMS =================
function spielerStaerke(s){return s.slice(2).reduce((a,b)=>a+b,0);}
function berechneTeams(){
  output.innerHTML="";
  const gks=Object.values(goalkeepers).filter(Boolean);
  const feld=spieler.filter(s=>s[1]&&!gks.includes(s[0]));
  const sortiert=feld.map(s=>{
    const base=spielerStaerke(s);
    const noise=(Math.random()-0.5)*VARIANCE_MODES[varianceIndex].value/100*base;
    return{name:s[0],base,score:base+noise};
  }).sort((a,b)=>b.score-a.score);

  let arr=Array.from({length:teams},()=>[]);
  let idx=0,dir=1;
  sortiert.forEach(sp=>{
    arr[idx].push(sp); idx+=dir;
    if(idx===teams){idx--;dir=-1;}
    if(idx<0){idx=0;dir=1;}
  });

  if(teams>gks.length && gks.length){
    output.innerHTML+=`<div class="goalkeeper-box"><b>Torhüter:</b><br>${gks.map((g,i)=>`Torhüter ${i+1}: ${g}`).join("<br>")}</div>`;
  }

  arr.forEach((t,i)=>{
    const avg=t.length?(t.reduce((s,p)=>s+p.base,0)/t.length).toFixed(1):"–";
    const gk=teams<=gks.length?`<br><b>Torhüter:</b> ${gks[i]||"–"}`:"";
    output.innerHTML+=`
<div class="team-card">
<b>Mannschaft ${i+1}</b> | Spieler: ${t.length} | Ø Stärke: ${avg}${gk}<br>
${t.map(p=>p.name).join(", ")}
</div>`;
  });
}

// ================= INIT =================
initTeamSelect(); loadTeam(activeTeam);
</script>

</body>
</html>
