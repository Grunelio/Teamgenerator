<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
:root{
  --pitch:#0f5132;
  --pitch-light:#e8f8f0;
  --fair:#ffd43b;
  --card:#ffffff;
  --gray:#f0f0f0;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  margin:0;
  padding:16px;
  background:var(--pitch);
}

h1{color:white;margin-bottom:12px;}

.section{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
}

label{font-weight:600;display:block;margin-top:6px;}

select,input[type=range]{width:100%;font-size:16px;padding:8px;}

.player{
  padding:12px;
  border-radius:12px;
  margin-bottom:6px;
  cursor:pointer;
  background:var(--gray);
}
.player.present{background:var(--pitch-light);}
.player.absent{background:#eee;color:#777;}

.edit-panel{
  padding-left:10px;
  margin-bottom:10px;
  border-left:4px solid var(--fair);
}

.team-card{
  background:#fff;
  border-left:6px solid var(--pitch);
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}

.goalkeeper-box{
  background:#eef5ff;
  border-left:6px solid #1c7ed6;
  padding:10px;
  border-radius:12px;
  margin-bottom:12px;
}

button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--pitch);
  color:white;
  font-size:16px;
}

.edit-icon{
  float:right;
  cursor:pointer;
  font-size:20px;
}

#pwModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}
#pwModal .box{
  background:white;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:320px;
}
#pwModal input{
  font-size:26px;
  width:100%;
  text-align:center;
}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
  <h2>👥 Mannschaft</h2>
  <select id="teamSelect"></select>
</div>

<div class="section">
  <h2>
    ⚙️ Einstellungen
    <span class="edit-icon" onclick="requestPassword(toggleEdit)">📊</span>
  </h2>

  <label>Anzahl Mannschaften</label>
  <select id="teamCount">
    <option>2</option><option>3</option><option>4</option>
    <option>5</option><option>6</option><option>7</option><option>8</option>
  </select>
</div>

<div class="section" id="goalkeeperSection" style="display:none;">
  <h2>🧤 Torhüter (E‑Jugend)</h2>
  <label>Torhüter 1</label>
  <select id="gk1"></select>
  <label>Torhüter 2</label>
  <select id="gk2"></select>
</div>

<div class="section">
  <h2>👥 Spieler</h2>
  <div id="spieler"></div>
</div>

<div class="section">
  <button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
  <h2>🏁 Mannschaften</h2>
  <div id="output"></div>
</div>

<div class="section">
  <h2>🎲 Modus ändern</h2>
  <label><strong><span id="varLabel"></span></strong></label>
  <input type="range" min="0" max="3" step="1" id="variance">
</div>

<div id="pwModal">
  <div class="box">
    <h3>🔒 Passwort</h3>
    <input type="number" id="pwInput" inputmode="numeric">
    <button onclick="confirmPassword()">OK</button>
  </div>
</div>

<script>
// ================= KONFIG =================
const EDIT_PASSWORT="1406";
const VARIANCE_MODES=[
  {value:0,label:"Fair‑Modus"},
  {value:30,label:"Trainings‑Mix"},
  {value:60,label:"Herausforderungs‑Modus"},
  {value:100,label:"Spaß‑Modus"}
];
const ATTRS=["Ball","Lauf","IQ","Def","Off","Chancen"];

const TEAMS={
  "Alte Herren":[
    ["Alex Gruen",1,3,3,3,3,3,3],
    ["Alex Koerkel",1,3,2,3,4,3,3],
    ["Andi Doerr",1,3,2,2,3,2,2],
    ["Birk",1,4,4,3,4,3,3],
    ["Christian",1,2,5,1,2,1,1],
    ["Daniel",1,3,2,2,3,4,3],
    ["Dominik",1,3,1,2,1,3,2],
    ["Erik",1,5,1,5,1,3,3],
    ["Frank",1,5,5,5,4,4,5],
    ["Jens",1,3,4,3,3,4,3],
    ["Jonas",1,4,5,4,4,4,4],
    ["Josua",1,4,3,5,5,3,4],
    ["Martin",1,1,5,2,3,3,2],
    ["Mehmet",1,4,3,3,2,4,3],
    ["Sebastian",1,2,2,2,3,2,2],
    ["Simon Loeffler",1,3,3,3,4,3,3],
    ["Soeren",1,3,3,3,4,3,3],
    ["Xeber",1,4,5,4,3,4,4],
    ["Moser",1,4,3,4,3,4,3],
    ["Andi K",1,3,4,3,4,3,3]
  ],
  "E‑Jugend":[
    ["Samuel",1,3,4,3,4,3,3],
    ["Jonah",1,5,1,4,4,3,3],
    ["Joshua Fritz",1,1,1,2,3,2,1],
    ["Moritz",1,3,4,2,4,3,2],
    ["Darian",1,2,1,2,2,3,3],
    ["David",1,2,3,2,3,2,1],
    ["Davyd",1,3,3,2,4,2,1],
    ["Jannick",1,2,4,2,4,3,2],
    ["Joshua Hoeber",1,3,5,2,5,2,2],
    ["Kyan",1,2,2,2,2,2,2],
    ["Leandro",1,2,2,2,3,3,1],
    ["Luis Rose",1,4,2,2,2,4,3],
    ["Luis Stabel",1,3,3,2,4,3,2],
    ["Max",1,1,2,2,3,1,1],
    ["Mika",1,2,1,2,2,2,2],
    ["Milo",1,2,3,2,3,2,1],
    ["Paul",1,3,3,3,3,3,3],
    ["Thiago",1,3,3,2,4,4,2],
    ["Toni",1,4,3,3,3,4,4]
  ]
};

// ================= STATE =================
let activeTeam=Object.keys(TEAMS)[0];
let spieler=[],teams=4,varianceIndex=0,editMode=false;
let goalkeepers={1:null,2:null};
let teamsBerechnet=false;

// ================= PASSWORT =================
let pwCallback=null;
function requestPassword(cb){
  pwCallback=cb;
  pwInput.value="";
  pwModal.style.display="flex";
}
function confirmPassword(){
  if(pwInput.value!==EDIT_PASSWORT){alert("Falsches Passwort");pwModal.style.display="none";return;}
  pwModal.style.display="none"; pwCallback&&pwCallback();
}

// ================= TEAM SELECT =================
Object.keys(TEAMS).forEach(t=>{
  const o=document.createElement("option");
  o.value=t;o.textContent=t;
  teamSelect.appendChild(o);
});
teamSelect.onchange=()=>loadTeam(teamSelect.value);

// ================= LOAD =================
function loadTeam(name){
  activeTeam=name;
  spieler=structuredClone(TEAMS[name]);
  goalkeepers={1:null,2:null};
  goalkeeperSection.style.display=name==="E‑Jugend"?"block":"none";
  renderSpieler(); renderGoalkeeperUI();
  teamsBerechnet=false;
}

// ================= SPIELER =================
function togglePresent(i){
  spieler[i][1]=spieler[i][1]?0:1;
  renderSpieler(); renderGoalkeeperUI();
}
function renderSpieler(){
  spielerDiv.innerHTML="";
  spieler.forEach((s,i)=>{
    spielerDiv.innerHTML+=`
<div class="player ${s[1]?"present":"absent"}" onclick="togglePresent(${i})">${s[0]}</div>
${editMode?`
<div class="edit-panel">
${ATTRS.map((n,j)=>`
<label>${n}: ${s[j+2]}</label>
<input type="range" min="1" max="5" value="${s[j+2]}"
oninput="spieler[${i}][${j+2}]=+this.value">`).join("")}
</div>`:""}`;
  });
}

// ================= TORHÜTER =================
function renderGoalkeeperUI(){
  if(activeTeam!=="E‑Jugend")return;
  const anwesend=spieler.filter(s=>s[1]).map(s=>s[0]);
  function fill(sel,other){
    sel.innerHTML="<option value=''>Kein Torhüter</option>";
    anwesend.forEach(n=>{
      if(n===other)return;
      const o=document.createElement("option");
      o.value=n;o.textContent=n;sel.appendChild(o);
    });
  }
  fill(gk1,goalkeepers[2]); fill(gk2,goalkeepers[1]);
  gk1.value=goalkeepers[1]||""; gk2.value=goalkeepers[2]||"";
  gk1.onchange=()=>{goalkeepers[1]=gk1.value||null;renderGoalkeeperUI();};
  gk2.onchange=()=>{goalkeepers[2]=gk2.value||null;renderGoalkeeperUI();};
}

// ================= TEAMNAMEN =================
function teamProfil(team){
  const sums=Array(6).fill(0);
  team.forEach(p=>p.values.forEach((v,i)=>sums[i]+=v));
  return sums.map(s=>s/team.length);
}
function teamName(avg){
  const e=avg.map((v,i)=>({a:ATTRS[i],v})).sort((a,b)=>b.v-a.v);
  if(e.every(x=>x.v>=3.5))return"⭐ Komplett‑Team";
  if(e[0].a==="Def"&&e[1].a==="Lauf")return"🛡️ Defensiv‑Wall";
  if(e[0].a==="Off"&&e[1].a==="Chancen")return"⚡ Torjäger";
  if(e[0].a==="Ball"&&e[1].a==="IQ")return"🧠 Ballkontrolle";
  if(e[0].a==="Lauf"&&e[1].a==="Off")return"🚀 Pressing‑Team";
  return"⚖️ Ausgeglichen";
}

// ================= TEAMS =================
function spielerStaerke(s){return s.slice(2).reduce((a,b)=>a+b,0);}
function berechneTeams(){
  teamsBerechnet=true;
  output.innerHTML="";
  const gks=Object.values(goalkeepers).filter(Boolean);
  const feld=spieler.filter(s=>s[1]&&!gks.includes(s[0]));
  const sortiert=feld.map(s=>{
    const base=spielerStaerke(s);
    const noise=(Math.random()-0.5)*VARIANCE_MODES[varianceIndex].value/100*base;
    return{name:s[0],base,score:base+noise};
  }).sort((a,b)=>b.score-a.score);

  let arr=Array.from({length:teams},()=>[]);
  let idx=0,dir=1;
  sortiert.forEach(sp=>{
    arr[idx].push(sp);idx+=dir;
    if(idx===teams){idx--;dir=-1;}
    if(idx<0){idx=0;dir=1;}
  });

  arr.forEach((t,i)=>{
    const players=t.map(p=>({
      name:p.name,
      values:spieler.find(s=>s[0]===p.name).slice(2)
    }));
    const name=teamName(teamProfil(players));
    const avg=(t.reduce((s,p)=>s+p.base,0)/t.length).toFixed(1);
    output.innerHTML+=`
<div class="team-card">
<b>Mannschaft ${i+1} – ${name}</b><br>
Spieler: ${t.map(p=>p.name).join(", ")}<br>
Ø Stärke: ${avg}
</div>`;
  });
}

// ================= INIT =================
loadTeam(activeTeam);
variance.oninput=()=>{
  varianceIndex=+variance.value;
  varLabel.textContent=VARIANCE_MODES[varianceIndex].label;
  if(teamsBerechnet)berechneTeams();
};
varLabel.textContent=VARIANCE_MODES[0].label;
</script>

</body>
</html>
