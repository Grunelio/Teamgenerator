<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  margin: 0;
  padding: 16px;
  background: #f4f6f8;
}
.section {
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 16px;
}
h1, h2 { margin-top: 0.5em; }

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  background: #007aff;
  color: white;
}
button.secondary {
  background: #e0e0e0;
  color: black;
}

select, input[type=number] {
  width: 100%;
  font-size: 16px;
  padding: 8px;
}

input[type=range] { width: 100%; }

.player {
  padding: 12px;
  border-bottom: 1px solid #eee;
  font-size: 18px;
  cursor: pointer;
}
.player.present { background: #e8f8f0; }
.player.absent { background: #f0f0f0; color: #999; }

.edit-panel {
  padding-left: 10px;
  margin-bottom: 10px;
}
label {
  font-weight: 600;
  display: block;
  margin-top: 6px;
}
.team-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
<h2>👥 Mannschaft</h2>

<select id="teamSelect" disabled></select>

<button class="secondary" onclick="unlockTeamSelect()">🔒 Mannschaft wechseln</button>
</div>

<div class="section">
<h2>⚙️ Einstellungen</h2>

<label>Anzahl Mannschaften</label>
<input type="number" id="teamCount" min="2" max="10">

<label>🎲 Modus: <strong><span id="varLabel"></span></strong></label>
<input type="range" min="0" max="3" step="1" id="variance">

<button class="secondary" onclick="toggleEdit()">🔒 Edit‑Modus</button>
</div>

<div class="section">
<h2>👥 Spieler</h2>
<div id="spieler"></div>
</div>

<div class="section">
<button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
<h2>🏁 Mannschaften</h2>
<div id="output"></div>
</div>

<script>
// ===============================
// 🔐 KONFIG
// ===============================
const EDIT_PASSWORT = "1406";

const VARIANCE_MODES = [
  { value: 0, label: "Fair‑Modus" },
  { value: 30, label: "Trainings‑Mix" },
  { value: 60, label: "Herausforderungs‑Modus" },
  { value: 100, label: "Spaß‑Modus" }
];

// ===============================
// 👥 MANNSCHAFTEN
// ===============================
const TEAMS = {
  "Alte Herren": [
    ["Alex Gruen",1,3,3,3,3,3,3],
    ["Alex Koerkel",1,3,2,3,4,3,3],
    ["Andi Doerr",1,3,2,2,3,2,2],
    ["Birk",1,4,4,3,4,3,3],
    ["Christian",1,2,5,1,2,1,1],
    ["Daniel",1,3,2,2,3,4,3],
    ["Dominik",1,3,1,2,1,3,2],
    ["Erik",1,5,1,5,1,3,3],
    ["Frank",1,5,5,5,4,4,5],
    ["Jens",1,3,4,3,3,4,3],
    ["Jonas",1,4,5,4,4,4,4],
    ["Josua",1,4,3,5,5,3,4],
    ["Martin",1,1,5,2,3,3,2],
    ["Mehmet",1,4,3,3,2,4,3],
    ["Sebastian",1,2,2,2,3,2,2],
    ["Simon Loeffler",1,3,3,3,4,3,3],
    ["Soeren",1,3,3,3,4,3,3],
    ["Xeber",1,4,5,4,3,4,4],
    ["Moser",1,4,3,4,3,4,3],
    ["Andi K",1,3,4,3,4,3,3]
  ],
  "E‑Jugend": [
    ["Samuel",1,3,4,3,4,3,3],
    ["Jonah",1,5,1,4,4,3,3],
    ["Joshua Fritz",1,1,1,2,3,2,1],
    ["Moritz",1,3,4,2,4,3,2],
    ["Darian",1,2,1,2,2,3,3],
    ["David",1,2,3,2,3,2,1],
    ["Davyd",1,3,3,2,4,2,1],
    ["Jannick",1,2,4,2,4,3,2],
    ["Joshua Hoeber",1,3,5,2,5,2,2],
    ["Kyan",1,2,2,2,2,2,2],
    ["Leandro",1,2,2,2,3,3,1],
    ["Luis Rose",1,4,2,2,2,4,3],
    ["Luis Stabel",1,3,3,2,4,3,2],
    ["Max",1,1,2,2,3,1,1],
    ["Mika",1,2,1,2,2,2,2],
    ["Milo",1,2,3,2,3,2,1],
    ["Paul",1,3,3,3,3,3,3],
    ["Thiago",1,3,3,2,4,4,2],
    ["Toni",1,4,3,3,3,4,4]
  ]
};

// ===============================
// 🔄 AKTIVE MANNSCHAFT
// ===============================
let activeTeam = localStorage.getItem("activeTeam") || Object.keys(TEAMS)[0];
let STORAGE_KEY = "teamgenerator_" + activeTeam;

function loadTeam(teamName) {
  activeTeam = teamName;
  STORAGE_KEY = "teamgenerator_" + activeTeam;
  localStorage.setItem("activeTeam", activeTeam);

  let data = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (!data) {
    data = {
      spieler: structuredClone(TEAMS[activeTeam]),
      teams: 4,
      varianceIndex: 0
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  spieler = data.spieler;
  teams = data.teams;
  varianceIndex = data.varianceIndex;

  updateSettingsUI();
  renderSpieler();
  document.getElementById("output").innerHTML = "";
}

// ===============================
// 💾 SAVE
// ===============================
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    spieler, teams, varianceIndex
  }));
}

// ===============================
// 🔓 TEAM AUSWAHL
// ===============================
const teamSelect = document.getElementById("teamSelect");

function initTeamSelect() {
  teamSelect.innerHTML = "";
  Object.keys(TEAMS).forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    teamSelect.appendChild(opt);
  });
  teamSelect.value = activeTeam;
}
initTeamSelect();

function unlockTeamSelect() {
  const pw = prompt("Mannschaft wechseln – Passwort:");
  if (pw !== EDIT_PASSWORT) return alert("Falsches Passwort");

  teamSelect.disabled = false;
  teamSelect.onchange = () => {
    teamSelect.disabled = true;
    loadTeam(teamSelect.value);
  };
}

// ===============================
// ⚙️ SETTINGS
// ===============================
const teamInput = document.getElementById("teamCount");
const varianceInput = document.getElementById("variance");
const varLabel = document.getElementById("varLabel");

function updateSettingsUI() {
  teamInput.value = teams;
  varianceInput.value = varianceIndex;
  varLabel.innerText = VARIANCE_MODES[varianceIndex].label;
}

teamInput.oninput = () => {
  teams = Number(teamInput.value);
  save();
};

varianceInput.oninput = () => {
  varianceIndex = Number(varianceInput.value);
  varLabel.innerText = VARIANCE_MODES[varianceIndex].label;
  save();
};

// ===============================
// 🔒 EDIT MODE
// ===============================
let editMode = false;
function toggleEdit() {
  if (!editMode) {
    const pw = prompt("Edit‑Modus – Passwort:");
    if (pw !== EDIT_PASSWORT) return alert("Falsches Passwort");
  }
  editMode = !editMode;
  renderSpieler();
}

// ===============================
// 👥 SPIELER UI
// ===============================
function togglePresent(i) {
  spieler[i][1] = spieler[i][1] ? 0 : 1;
  save();
  renderSpieler();
}

function renderSpieler() {
  const div = document.getElementById("spieler");
  div.innerHTML = "";

  spieler.forEach((s,i)=>{
    div.innerHTML += `
<div class="player ${s[1] ? "present" : "absent"}"
     onclick="togglePresent(${i})">
  ${s[0]}
</div>
${editMode ? `
<div class="edit-panel">
  ${["Ball","Lauf","IQ","Def","Off","Chancen"].map((n,j)=>`
    <label>${n}: ${s[j+2]}</label>
    <input type="range" min="1" max="5" value="${s[j+2]}"
      oninput="spieler[${i}][${j+2}]=+this.value;save()">
  `).join("")}
</div>` : ""}
`;
  });
}

// ===============================
// ⚽ TEAMLOGIK
// ===============================
function spielerStaerke(s) {
  return s.slice(2).reduce((a,b)=>a+b,0);
}

function berechneTeams() {
  const aktive = spieler.filter(s=>s[1]);
  const variance = VARIANCE_MODES[varianceIndex].value;

  const sortiert = aktive.map(s=>{
    const base = spielerStaerke(s);
    const noise = (Math.random()-0.5) * variance/100 * base;
    return { name:s[0], base, score: base + noise };
  }).sort((a,b)=>b.score-a.score);

  let teamArr = Array.from({length: teams}, () => []);
  let idx=0, dir=1;

  sortiert.forEach(sp=>{
    teamArr[idx].push(sp);
    idx += dir;
    if (idx === teams) { idx--; dir = -1; }
    if (idx < 0) { idx = 0; dir = 1; }
  });

  const out = document.getElementById("output");
  out.innerHTML = "";

  teamArr.forEach((t,i)=>{
    const sum = t.reduce((s,p)=>s+p.base,0);
    const avg = t.length ? (sum / t.length).toFixed(1) : "–";

    out.innerHTML += `
<div class="team-card">
<b>Mannschaft ${i+1}</b> |
Spieler: ${t.length} |
Ø Stärke: ${avg}<br>
${t.map(p=>p.name).join(", ")}
</div>`;
  });
}

// ===============================
// INIT
// ===============================
loadTeam(activeTeam);
</script>

</body>
</html>
