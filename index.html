<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>⚽ Teamgenerator Offline</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; }
table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
input[type=range] { width: 90px; }
input[type=number] { width: 60px; }
button { padding: 6px 10px; margin: 5px; }
.team { margin-bottom: 12px; }
</style>
</head>
<body>

<h1>⚽ Teamgenerator (Offline)</h1>

<h2>⚙️ Einstellungen</h2>
<label>
Anzahl Mannschaften:
<input type="number" min="2" max="10" id="teamCount">
</label>

<hr>

<h2>👥 Spielerliste</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Anwesend</th>
<th>Ball</th>
<th>Lauf</th>
<th>IQ</th>
<th>Def</th>
<th>Off</th>
<th>Chancen</th>
<th>❌</th>
</tr>
</thead>
<tbody id="spielerTable"></tbody>
</table>

<button onclick="addSpieler()">➕ Spieler hinzufügen</button>
<button onclick="berechneTeams()">⚽ Teams berechnen</button>

<hr>
<div id="output"></div>

<script>
// ===============================
// 💾 STORAGE
// ===============================
const STORAGE_KEY_SPIELER = "teamgenerator_spieler";
const STORAGE_KEY_TEAMS   = "teamgenerator_teamcount";

// ===============================
// 👥 STARTDATEN
// ===============================
const defaultSpieler = [
["Alex Gruen",1,3,3,3,3,3,3],
["Alex Koerkel",1,3,2,3,4,3,3],
["Andi Doerr",1,3,2,2,3,2,2],
["Birk",1,4,4,3,4,3,3],
["Christian",1,2,5,1,2,1,1],
["Daniel",1,3,2,2,3,4,3],
["Dominik",1,3,1,2,1,3,2],
["Erik",1,5,1,5,1,3,3],
["Frank",1,5,5,5,4,4,5],
["Jens",1,3,4,3,3,4,3],
["Jonas",1,4,5,4,4,4,4],
["Josua",1,4,3,5,5,3,4],
["Martin",1,1,5,2,3,3,2],
["Mehmet",1,4,3,3,2,4,3],
["Sebastian",1,2,2,2,3,2,2],
["Simon",1,3,3,3,4,3,3],
["Soeren",1,3,3,3,4,3,3],
["Xeber",1,4,5,4,3,4,4],
["Moser",1,4,3,4,3,4,3],
["Andi K",1,3,4,3,4,3,3]
];

let spieler = JSON.parse(localStorage.getItem(STORAGE_KEY_SPIELER)) || defaultSpieler;
let anzahlMannschaften = Number(localStorage.getItem(STORAGE_KEY_TEAMS)) || 4;

// ===============================
// 💾 SAVE
// ===============================
function save() {
  localStorage.setItem(STORAGE_KEY_SPIELER, JSON.stringify(spieler));
  localStorage.setItem(STORAGE_KEY_TEAMS, anzahlMannschaften);
}

// ===============================
// ⚙️ SETTINGS
// ===============================
const teamInput = document.getElementById("teamCount");
teamInput.value = anzahlMannschaften;
teamInput.onchange = () => {
  anzahlMannschaften = Number(teamInput.value);
  save();
};

// ===============================
// 🧱 UI
// ===============================
function slider(i, idx) {
  return `
<td>
<input type="range" min="1" max="5" value="${spieler[i][idx]}"
oninput="
spieler[${i}][${idx}] = Number(this.value);
document.getElementById('v${i}_${idx}').innerText = this.value;
save();
">
<br><span id="v${i}_${idx}">${spieler[i][idx]}</span>
</td>`;
}

function renderTable() {
  const tbody = document.getElementById("spielerTable");
  tbody.innerHTML = "";

  spieler.forEach((s, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
<td><input value="${s[0]}" onchange="spieler[${i}][0]=this.value;save()"></td>

<td>
<select onchange="spieler[${i}][1]=Number(this.value);save()">
<option value="1" ${s[1]===1 ? "selected":""}>Anwesend</option>
<option value="0" ${s[1]===0 ? "selected":""}>Abwesend</option>
</select>
</td>

${slider(i,2)}
${slider(i,3)}
${slider(i,4)}
${slider(i,5)}
${slider(i,6)}
${slider(i,7)}

<td><button onclick="removeSpieler(${i})">❌</button></td>
`;
    tbody.appendChild(tr);
  });
}

function addSpieler() {
  spieler.push(["Neu",1,3,3,3,3,3,3]);
  save();
  renderTable();
}

function removeSpieler(i) {
  spieler.splice(i,1);
  save();
  renderTable();
}

// ===============================
// ⚽ TEAMLOGIK
// ===============================
function staerke(s) {
  return s.Ballkontrolle +
         s.Laufbereitschaft +
         s.Spielintelligenz +
         s.Defensiv +
         s.Offensiv +
         s.Chancenverwertung;
}

function berechneTeams() {
  const aktive = spieler
    .filter(s => s[1] === 1)
    .map(s => ({
      Name: s[0],
      Ballkontrolle: s[2],
      Laufbereitschaft: s[3],
      Spielintelligenz: s[4],
      Defensiv: s[5],
      Offensiv: s[6],
      Chancenverwertung: s[7]
    }));

  aktive.forEach(s => s.Staerke = staerke(s));
  aktive.sort((a,b)=>b.Staerke-a.Staerke);

  let teams = Array.from({length: anzahlMannschaften},
    () => ({Spieler:[], Staerke:0}));

  let idx=0, dir=1;
  for (let sp of aktive) {
    teams[idx].Spieler.push(sp);
    teams[idx].Staerke += sp.Staerke;
    idx += dir;
    if (idx === anzahlMannschaften) { idx--; dir=-1; }
    if (idx < 0) { idx=0; dir=1; }
  }

  const out = document.getElementById("output");
  out.innerHTML = "<h2>🏁 Mannschaften</h2>";

  teams.forEach((t,i)=>{
    out.innerHTML += `
<div class="team">
<b>Mannschaft ${i+1}</b> |
Spieler: ${t.Spieler.length} |
Ø ${(t.Staerke/t.Spieler.length).toFixed(2)}<br>
${t.Spieler.map(s=>s.Name).join(", ")}
</div>`;
  });
}

// ===============================
renderTable();
</script>

</body>
</html>
