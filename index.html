<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  margin: 0;
  padding: 16px;
  background: #f4f6f8;
}

h1, h2 { margin-top: 0.5em; }

.section {
  background: white;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 16px;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 10px;
}

input[type=range] {
  width: 100%;
}

input[type=number] {
  width: 80px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: white;
}

button.secondary {
  background: #ddd;
  color: black;
}

.player-card {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 12px;
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.player-header input {
  font-size: 16px;
  width: 60%;
}

.team-card {
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 12px;
}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
<h2>⚙️ Einstellungen</h2>

<label>Anzahl Mannschaften</label>
<input type="number" id="teamCount" min="2" max="10">

<label>🎲 Varianz (Durchmischung)</label>
<input type="range" min="0" max="100" id="variance">
<span id="varianceLabel"></span>
</div>

<div class="section">
<h2>👥 Spieler</h2>
<div id="spieler"></div>
<button class="secondary" onclick="addSpieler()">➕ Spieler hinzufügen</button>
</div>

<div class="section">
<button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
<h2>🏁 Mannschaften</h2>
<div id="output"></div>
</div>

<script>
// ===============================
// DATA
// ===============================
const STORAGE_KEY = "teamgen_v3";

const defaultSpieler = [
["Alex Gruen",1,3,3,3,3,3,3],
["Frank",1,5,5,5,4,4,5],
["Jonas",1,4,5,4,4,4,4],
["Moser",1,4,3,4,3,4,3],
];

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  teams: 4,
  variance: 0,
  spieler: defaultSpieler
};

let { teams, variance, spieler } = data;

// ===============================
// SAVE
// ===============================
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ teams, variance, spieler }));
}

// ===============================
// UI INIT
// ===============================
const teamInput = document.getElementById("teamCount");
const varianceInput = document.getElementById("variance");
const varianceLabel = document.getElementById("varianceLabel");

teamInput.value = teams;
varianceInput.value = variance;
varianceLabel.innerText = variance + "%";

teamInput.oninput = () => { teams = +teamInput.value; save(); };
varianceInput.oninput = () => {
  variance = +varianceInput.value;
  varianceLabel.innerText = variance + "%";
  save();
};

// ===============================
// SPIELER UI
// ===============================
function renderSpieler() {
  const div = document.getElementById("spieler");
  div.innerHTML = "";

  spieler.forEach((s,i)=>{
    div.innerHTML += `
<div class="player-card">
  <div class="player-header">
    <input value="${s[0]}" onchange="spieler[${i}][0]=this.value;save()">
    <select onchange="spieler[${i}][1]=+this.value;save()">
      <option value="1" ${s[1]?"selected":""}>✅</option>
      <option value="0" ${!s[1]?"selected":""}>❌</option>
    </select>
  </div>

  ${["Ball","Lauf","IQ","Def","Off","Chancen"].map((n,j)=>`
    <label>${n}: ${s[j+2]}</label>
    <input type="range" min="1" max="5" value="${s[j+2]}"
      oninput="spieler[${i}][${j+2}]=+this.value;renderSpieler();save()">
  `).join("")}

  <button class="secondary" onclick="removeSpieler(${i})">❌ Spieler löschen</button>
</div>`;
  });
}

function addSpieler() {
  spieler.push(["Neu",1,3,3,3,3,3,3]);
  save();
  renderSpieler();
}

function removeSpieler(i) {
  spieler.splice(i,1);
  save();
  renderSpieler();
}

// ===============================
// TEAMLOGIK + VARIANZ
// ===============================
function staerke(s) {
  return s.slice(2).reduce((a,b)=>a+b,0);
}

function berechneTeams() {
  const aktive = spieler.filter(s=>s[1]);

  const berechnet = aktive.map(s=>{
    const base = staerke(s);
    const noise = (Math.random()-0.5) * variance / 100 * base;
    return { name:s[0], score: base + noise };
  });

  berechnet.sort((a,b)=>b.score-a.score);

  let teamsArr = Array.from({length:teams},()=>[]);
  let idx=0,dir=1;

  for(let sp of berechnet){
    teamsArr[idx].push(sp.name);
    idx+=dir;
    if(idx===teams){idx--;dir=-1;}
    if(idx<0){idx=0;dir=1;}
  }

  const out = document.getElementById("output");
  out.innerHTML = "";

  teamsArr.forEach((t,i)=>{
    out.innerHTML += `
<div class="team-card">
<b>Mannschaft ${i+1}</b><br>
${t.join(", ")}
</div>`;
  });
}

// ===============================
renderSpieler();
</script>

</body>
</html>
