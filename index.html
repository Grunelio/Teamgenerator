<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
:root{
  --green:#0f5132;
  --green-light:#e6f2ec;
  --bg:#0b3d2e;
  --card:#ffffff;
}

body{
  font-family: system-ui,-apple-system,BlinkMacSystemFont;
  margin:0;
  padding:16px;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.04) 0,
      rgba(255,255,255,0.04) 2px,
      transparent 2px,
      transparent 60px
    ),
    var(--bg);
}

h1{color:white;margin-bottom:10px;}

.section{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.edit-icon{
  font-size:20px;
  cursor:pointer;
  opacity:.5;
}
.edit-icon.active{
  opacity:1;
  color:var(--green);
}

select{
  width:100%;
  padding:10px;
  font-size:16px;
  border-radius:10px;
}

input[type=range]{ width:100%; }

.player{
  padding:14px;
  border-radius:12px;
  margin-bottom:6px;
  font-size:17px;
  cursor:pointer;
  background:#f5f5f5;
}
.player.present{ background:var(--green-light); }
.player.absent{ background:#eee;color:#777; }

.edit-panel{
  padding:10px;
  background:#fafafa;
  border-left:4px solid var(--green);
  border-radius:10px;
  margin-bottom:10px;
}

.team-card{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  border-left:6px solid var(--green);
}

.goalkeeper-box{
  background:#eef5ff;
  border-radius:12px;
  padding:10px;
  margin-bottom:12px;
  border-left:6px solid #1c7ed6;
}

/* Passwort Modal */
#pwModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
#pwModal .box{
  background:white;
  padding:20px;
  border-radius:18px;
  width:90%;
  max-width:320px;
}
#pwModal input{
  width:100%;
  font-size:26px;
  text-align:center;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--green);
  color:white;
  font-size:16px;
}
button.secondary{
  background:#ddd;
  color:black;
}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
  <h2>👥 Mannschaft</h2>
  <select id="teamSelect"></select>
</div>

<div class="section">
  <div class="card-header">
    <h2>⚙️ Einstellungen</h2>
    <span id="editIcon" class="edit-icon">📊</span>
  </div>

  <label>Anzahl Mannschaften</label>
  <select id="teamCount">
    <option>2</option><option>3</option><option>4</option>
    <option>5</option><option>6</option><option>7</option><option>8</option>
  </select>

  <label>🎲 Modus: <strong><span id="varLabel"></span></strong></label>
  <input type="range" min="0" max="3" step="1" id="variance">
</div>

<div class="section" id="goalkeeperSection" style="display:none;">
  <h2>🧤 Torhüter (E‑Jugend)</h2>
  <label>Torhüter 1</label>
  <select id="gk1"></select>
  <label>Torhüter 2</label>
  <select id="gk2"></select>
</div>

<div class="section">
  <h2>👥 Spieler</h2>
  <div id="spieler"></div>
</div>

<div class="section">
  <button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
  <h2>🏁 Mannschaften</h2>
  <div id="output"></div>
</div>

<!-- Passwort -->
<div id="pwModal">
  <div class="box">
    <h3>🔒 Passwort</h3>
    <input type="number" id="pwInput" inputmode="numeric">
    <button onclick="confirmPassword()">OK</button>
    <button class="secondary" onclick="closePw()">Abbrechen</button>
  </div>
</div>

<script>
// ===== KONFIG =====
const EDIT_PASSWORT="1406";
const VARIANCE_MODES=[
  {value:0,label:"Fair‑Modus"},
  {value:30,label:"Trainings‑Mix"},
  {value:60,label:"Herausforderungs‑Modus"},
  {value:100,label:"Spaß‑Modus"}
];

const TEAMS={
  "Alte Herren":[["Alex",1,3,3,3,3,3,3],["Birk",1,4,4,3,4,3,3]],
  "E‑Jugend":[["Paul",1,3,3,3,3,3,3],["Toni",1,4,3,3,3,4,4]]
};

// ===== PASSWORT =====
let pwCallback=null;
function requestPassword(cb){
  pwCallback=cb;
  pwInput.value="";
  pwModal.style.display="flex";
  setTimeout(()=>pwInput.focus(),50);
}
function confirmPassword(){
  if(pwInput.value!==EDIT_PASSWORT){alert("Falsches Passwort");closePw();return;}
  closePw();pwCallback&&pwCallback();
}
function closePw(){pwModal.style.display="none";}

// ===== STATE =====
let activeTeam=Object.keys(TEAMS)[0];
let spieler=[],teams=2,varianceIndex=0,editMode=false;
let goalkeepers={1:null,2:null};

// ===== UI =====
editIcon.onclick=()=>requestPassword(()=>{
  editMode=!editMode;
  editIcon.classList.toggle("active",editMode);
  renderSpieler();
});

function renderSpieler(){
  spielerDiv.innerHTML="";
  spieler.forEach((s,i)=>{
    const p=document.createElement("div");
    p.className="player "+(s[1]?"present":"absent");
    p.textContent=s[0];
    p.addEventListener("click",()=>togglePresent(i));
    spielerDiv.appendChild(p);

    if(editMode){
      const ep=document.createElement("div");
      ep.className="edit-panel";
      ep.textContent="Bewertungen …";
      spielerDiv.appendChild(ep);
    }
  });
}

function togglePresent(i){
  spieler[i][1]=spieler[i][1]?0:1;
  renderSpieler();
}

// ===== INIT =====
function loadTeam(name){
  activeTeam=name;
  spieler=structuredClone(TEAMS[name]);
  renderSpieler();
}

teamSelect.onchange=()=>requestPassword(()=>loadTeam(teamSelect.value));
Object.keys(TEAMS).forEach(t=>{
  const o=document.createElement("option");
  o.value=t;o.textContent=t;
  teamSelect.appendChild(o);
});
loadTeam(activeTeam);
</script>

</body>
</html>
