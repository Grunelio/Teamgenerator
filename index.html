<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  margin: 0;
  padding: 16px;
  background: #f4f6f8;
}
.section {
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 16px;
}
h1, h2 { margin-top: 0.5em; }

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  background: #007aff;
  color: white;
}
button.secondary {
  background: #e0e0e0;
  color: black;
}

select {
  width: 100%;
  font-size: 16px;
  padding: 8px;
}

input[type=range] { width: 100%; }

.player {
  padding: 12px;
  border-bottom: 1px solid #eee;
  font-size: 18px;
  cursor: pointer;
}
.player.present { background: #e8f8f0; }
.player.absent { background: #f0f0f0; color: #999; }

.edit-panel {
  padding-left: 10px;
  margin-bottom: 10px;
}

label {
  font-weight: 600;
  display: block;
  margin-top: 6px;
}

.team-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}

.goalkeeper-box {
  background:#eef5ff;
  padding:8px;
  border-radius:8px;
  margin-bottom:8px;
}

/* Passwort Modal */
#pwModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
#pwModal .box {
  background: white;
  border-radius: 14px;
  padding: 20px;
  width: 90%;
  max-width: 320px;
}
#pwModal input {
  font-size: 26px;
  text-align: center;
  width: 100%;
}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
<h2>👥 Mannschaft</h2>
<select id="teamSelect"></select>
</div>

<div class="section">
<h2>⚙️ Einstellungen</h2>

<label>Anzahl Mannschaften</label>
<select id="teamCount">
  <option>2</option><option>3</option><option>4</option>
  <option>5</option><option>6</option><option>7</option><option>8</option>
</select>

<label>🎲 Modus: <strong><span id="varLabel"></span></strong></label>
<input type="range" min="0" max="3" step="1" id="variance">

<button class="secondary" onclick="requestPassword(toggleEdit)">
🔒 Edit‑Modus (Bewertungen)
</button>
</div>

<div class="section" id="goalkeeperSection" style="display:none;">
<h2>🧤 Torhüter (E‑Jugend)</h2>

<label>Torhüter 1</label>
<select id="gk1"></select>

<label>Torhüter 2</label>
<select id="gk2"></select>
</div>

<div class="section">
<h2>👥 Spieler</h2>
<div id="spieler"></div>
</div>

<div class="section">
<button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
<h2>🏁 Mannschaften</h2>
<div id="output"></div>
</div>

<!-- Passwort Modal -->
<div id="pwModal">
  <div class="box">
    <h3>🔒 Passwort</h3>
    <input type="number" id="pwInput" inputmode="numeric">
    <button onclick="confirmPassword()">OK</button>
    <button class="secondary" onclick="closePw()">Abbrechen</button>
  </div>
</div>

<script>
// ================= KONFIG =================
const EDIT_PASSWORT = "1406";
let pwCallback = null;

const VARIANCE_MODES = [
  { value: 0, label: "Fair‑Modus" },
  { value: 30, label: "Trainings‑Mix" },
  { value: 60, label: "Herausforderungs‑Modus" },
  { value: 100, label: "Spaß‑Modus" }
];

// ================= SPIELERLISTEN (VOLLSTÄNDIG) =================
const TEAMS = {
  "Alte Herren": [
    ["Alex Gruen",1,3,3,3,3,3,3],
    ["Alex Koerkel",1,3,2,3,4,3,3],
    ["Andi Doerr",1,3,2,2,3,2,2],
    ["Birk",1,4,4,3,4,3,3],
    ["Christian",1,2,5,1,2,1,1],
    ["Daniel",1,3,2,2,3,4,3],
    ["Dominik",1,3,1,2,1,3,2],
    ["Erik",1,5,1,5,1,3,3],
    ["Frank",1,5,5,5,4,4,5],
    ["Jens",1,3,4,3,3,4,3],
    ["Jonas",1,4,5,4,4,4,4],
    ["Josua",1,4,3,5,5,3,4],
    ["Martin",1,1,5,2,3,3,2],
    ["Mehmet",1,4,3,3,2,4,3],
    ["Sebastian",1,2,2,2,3,2,2],
    ["Simon Loeffler",1,3,3,3,4,3,3],
    ["Soeren",1,3,3,3,4,3,3],
    ["Xeber",1,4,5,4,3,4,4],
    ["Moser",1,4,3,4,3,4,3],
    ["Andi K",1,3,4,3,4,3,3]
  ],
  "E‑Jugend": [
    ["Samuel",1,3,4,3,4,3,3],
    ["Jonah",1,5,1,4,4,3,3],
    ["Joshua Fritz",1,1,1,2,3,2,1],
    ["Moritz",1,3,4,2,4,3,2],
    ["Darian",1,2,1,2,2,3,3],
    ["David",1,2,3,2,3,2,1],
    ["Davyd",1,3,3,2,4,2,1],
    ["Jannick",1,2,4,2,4,3,2],
    ["Joshua Hoeber",1,3,5,2,5,2,2],
    ["Kyan",1,2,2,2,2,2,2],
    ["Leandro",1,2,2,2,3,3,1],
    ["Luis Rose",1,4,2,2,2,4,3],
    ["Luis Stabel",1,3,3,2,4,3,2],
    ["Max",1,1,2,2,3,1,1],
    ["Mika",1,2,1,2,2,2,2],
    ["Milo",1,2,3,2,3,2,1],
    ["Paul",1,3,3,3,3,3,3],
    ["Thiago",1,3,3,2,4,4,2],
    ["Toni",1,4,3,3,3,4,4]
  ]
};

// ================= STATE =================
let activeTeam = Object.keys(TEAMS)[0];
let spieler = [];
let teams = 4;
let varianceIndex = 0;
let editMode = false;
let goalkeepers = {1:null,2:null};

// ================= PASSWORT =================
function requestPassword(cb){
  pwCallback = cb;
  pwInput.value = "";
  pwModal.style.display = "flex";
}
function confirmPassword(){
  if(pwInput.value !== EDIT_PASSWORT){
    alert("Falsches Passwort");
    pwModal.style.display="none";
    return;
  }
  pwModal.style.display="none";
  pwCallback && pwCallback();
}
function closePw(){ pwModal.style.display="none"; }

// ================= TEAM SELECT =================
Object.keys(TEAMS).forEach(t=>{
  const o=document.createElement("option");
  o.value=t;o.textContent=t;
  teamSelect.appendChild(o);
});
teamSelect.onchange=()=>loadTeam(teamSelect.value);

// ================= LOAD =================
function loadTeam(name){
  activeTeam=name;
  spieler=structuredClone(TEAMS[name]);
  goalkeepers={1:null,2:null};
  goalkeeperSection.style.display=name==="E‑Jugend"?"block":"none";
  renderSpieler();
  renderGoalkeeperUI();
  output.innerHTML="";
}

// ================= SPIELER =================
function togglePresent(i){
  spieler[i][1]=spieler[i][1]?0:1;
  renderSpieler();
  renderGoalkeeperUI();
}
function renderSpieler(){
  spielerDiv.innerHTML="";
  spieler.forEach((s,i)=>{
    spielerDiv.innerHTML+=`
<div class="player ${s[1]?"present":"absent"}"
onclick="togglePresent(${i})">${s[0]}</div>
${editMode?`
<div class="edit-panel">
${["Ball","Lauf","IQ","Def","Off","Chancen"].map((n,j)=>`
<label>${n}: ${s[j+2]}</label>
<input type="range" min="1" max="5" value="${s[j+2]}"
oninput="spieler[${i}][${j+2}]=+this.value">`).join("")}
</div>`:""}`;
  });
}

// ================= TORHÜTER =================
function renderGoalkeeperUI(){
  if(activeTeam!=="E‑Jugend")return;
  const anwesend=spieler.filter(s=>s[1]).map(s=>s[0]);
  function fill(sel,other){
    sel.innerHTML="<option value=''>Kein Torhüter</option>";
    anwesend.forEach(n=>{
      if(n===other)return;
      const o=document.createElement("option");
      o.value=n;o.textContent=n;
      sel.appendChild(o);
    });
  }
  fill(gk1,goalkeepers[2]);
  fill(gk2,goalkeepers[1]);
  gk1.value=goalkeepers[1]||"";
  gk2.value=goalkeepers[2]||"";
  gk1.onchange=()=>{goalkeepers[1]=gk1.value||null;renderGoalkeeperUI();};
  gk2.onchange=()=>{goalkeepers[2]=gk2.value||null;renderGoalkeeperUI();};
}

// ================= TEAMS =================
function spielerStaerke(s){return s.slice(2).reduce((a,b)=>a+b,0);}
function berechneTeams(){
  output.innerHTML="";
  const feld=spieler.filter(s=>s[1]);
  const sortiert=feld.map(s=>{
    const base=spielerStaerke(s);
    const noise=(Math.random()-0.5)*VARIANCE_MODES[varianceIndex].value/100*base;
    return{name:s[0],base,score:base+noise};
  }).sort((a,b)=>b.score-a.score);

  let arr=Array.from({length:teams},()=>[]);
  let idx=0,dir=1;
  sortiert.forEach(sp=>{
    arr[idx].push(sp);
    idx+=dir;
    if(idx===teams){idx--;dir=-1;}
    if(idx<0){idx=0;dir=1;}
  });

  arr.forEach((t,i)=>{
    const avg=(t.reduce((s,p)=>s+p.base,0)/t.length).toFixed(1);
    output.innerHTML+=`
<div class="team-card">
<b>Mannschaft ${i+1}</b><br>
Spieler: ${t.map(p=>p.name).join(", ")}<br>
Ø Stärke: ${avg}
</div>`;
  });
}

// ================= INIT =================
loadTeam(activeTeam);
variance.oninput=()=>{
  varianceIndex=+variance.value;
  varLabel.textContent=VARIANCE_MODES[varianceIndex].label;
};
varLabel.textContent=VARIANCE_MODES[0].label;
</script>

</body>
</html>
