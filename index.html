<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Teamgenerator</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  margin: 0;
  padding: 16px;
  background: #f4f6f8;
}

.section {
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 16px;
}

h1, h2 { margin-top: 0.5em; }

button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  background: #007aff;
  color: white;
}

button.secondary {
  background: #e0e0e0;
  color: black;
}

.player {
  padding: 12px;
  border-bottom: 1px solid #eee;
  font-size: 18px;
  cursor: pointer;
}

.player.present { background: #e8f8f0; }
.player.absent  { background: #f0f0f0; color: #999; }

.edit-panel {
  margin-top: 8px;
  padding-left: 10px;
}

label {
  font-weight: 600;
  display: block;
  margin-top: 6px;
}

input[type=range] {
  width: 100%;
}

.team-card {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}
</style>
</head>

<body>

<h1>⚽ Teamgenerator</h1>

<div class="section">
<button onclick="toggleEdit()">🔒 Edit‑Modus</button>
</div>

<div class="section">
<h2>👥 Spieler</h2>
<div id="spieler"></div>
</div>

<div class="section">
<button onclick="berechneTeams()">⚽ Teams berechnen</button>
</div>

<div class="section">
<h2>🏁 Mannschaften</h2>
<div id="output"></div>
</div>

<script>
// ===============================
// 🔐 KONFIG
// ===============================
const STORAGE_KEY = "teamgenerator_editmode_v1";
const EDIT_PASSWORT = "1406";

// [Name, Anwesend, Ball, Lauf, IQ, Def, Off, Chancen]
const INITIAL_SPIELER = [
["Alex Gruen",1,3,3,3,3,3,3],
["Alex Koerkel",1,3,2,3,4,3,3],
["Andi Doerr",1,3,2,2,3,2,2],
["Birk",1,4,4,3,4,3,3],
["Christian",1,2,5,1,2,1,1],
["Daniel",1,3,2,2,3,4,3],
["Dominik",1,3,1,2,1,3,2],
["Erik",1,5,1,5,1,3,3],
["Frank",1,5,5,5,4,4,5],
["Jens",1,3,4,3,3,4,3],
["Jonas",1,4,5,4,4,4,4],
["Josua",1,4,3,5,5,3,4],
["Martin",1,1,5,2,3,3,2],
["Mehmet",1,4,3,3,2,4,3],
["Sebastian",1,2,2,2,3,2,2],
["Simon",1,3,3,3,4,3,3],
["Soeren",1,3,3,3,4,3,3],
["Xeber",1,4,5,4,3,4,4],
["Moser",1,4,3,4,3,4,3],
["Andi K",1,3,4,3,4,3,3]
];

// ===============================
// LOAD / SAVE
// ===============================
let data = JSON.parse(localStorage.getItem(STORAGE_KEY));
if (!data) {
  data = { spieler: structuredClone(INITIAL_SPIELER) };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let spieler = data.spieler;
let editMode = false;

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ spieler }));
}

// ===============================
// EDIT MODE
// ===============================
function toggleEdit() {
  if (!editMode) {
    const pw = prompt("Edit‑Modus – Passwort eingeben:");
    if (pw !== EDIT_PASSWORT) return alert("Falsches Passwort");
  }
  editMode = !editMode;
  renderSpieler();
}

// ===============================
// SPIELER UI
// ===============================
function togglePresent(i) {
  spieler[i][1] = spieler[i][1] ? 0 : 1;
  save();
  renderSpieler();
}

function renderSpieler() {
  const div = document.getElementById("spieler");
  div.innerHTML = "";

  spieler.forEach((s,i)=>{
    div.innerHTML += `
<div class="player ${s[1] ? "present" : "absent"}"
     onclick="togglePresent(${i})">
  ${s[0]}
</div>

${editMode ? `
<div class="edit-panel">
  ${["Ball","Lauf","IQ","Def","Off","Chancen"].map((n,j)=>`
    <label>${n}: ${s[j+2]}</label>
    <input type="range" min="1" max="5" value="${s[j+2]}"
      oninput="spieler[${i}][${j+2}]=+this.value;save()">
  `).join("")}
</div>` : ""}
`;
  });
}

// ===============================
// TEAMLOGIK (Fair)
 // ===============================
function berechneTeams() {
  const aktive = spieler.filter(s=>s[1]);

  const sortiert = aktive
    .map(s=>{
      const base = s.slice(2).reduce((a,b)=>a+b,0);
      return { name:s[0], score:base };
    })
    .sort((a,b)=>b.score-a.score);

  let teams = [[],[],[],[]];
  let idx=0,dir=1;

  sortiert.forEach(sp=>{
    teams[idx].push(sp.name);
    idx+=dir;
    if(idx===4){idx--;dir=-1;}
    if(idx<0){idx=0;dir=1;}
  });

  const out=document.getElementById("output");
  out.innerHTML="";
  teams.forEach((t,i)=>{
    out.innerHTML+=`
<div class="team-card">
<b>Mannschaft ${i+1}</b><br>
${t.join(", ")}
</div>`;
  });
}

renderSpieler();
</script>

</body>
</html>
